# Definir el bundle e incluir la configuración del Job.
bundle:
  name: m4_proyecto_ev

include:
  - resources/*.yml

# Separar las rutas de despliegue de cada target.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  # Mantener desarrollo como target predeterminado.
  dev:
    default: true
    mode: development

  # Fijar la ruta de producción y activar su ejecución diaria.
  prod:
    mode: production

    workspace:
      root_path: /Workspace/Users/josuefallas@gmail.com/.bundle/${bundle.name}/${bundle.target}

    run_as:
      user_name: josuefallas@gmail.com

    resources:
      jobs:
        ev_job:
          schedule:
            quartz_cron_expression: "0 0 8 * * ?"
            timezone_id: America/Costa_Rica
            pause_status: UNPAUSED