# Definir el bundle y sus destinos de despliegue.
bundle:
  name: m4_proyecto_ev

include:
  - resources/*.yml

# Separar los archivos desplegados de cada target.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    run_as:
      user_name: ${workspace.current_user.userName}